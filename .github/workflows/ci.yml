name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gnome-shell libglib2.0-bin nodejs

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run extension/schemas

      - name: Check JavaScript syntax
        run: |
          for f in extension/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - name: Pack extension
        run: make pack

      - name: Check package contents
        run: |
          unzip -l dist/*.shell-extension.zip
          unzip -l dist/*.shell-extension.zip | grep -q ocr.js
          unzip -l dist/*.shell-extension.zip | grep -q text-extractor-symbolic.svg
